<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B8FFF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="256" y1="64" x2="256" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base for Maskable Icon -->
  <rect width="512" height="512" rx="110" fill="#0B0F14" />
  
  <!-- Outer Shield Aura -->
  <path d="M256 70 L410 128 C410 270 348 380 256 442 C164 380 102 270 102 128 Z" 
        fill="url(#glowGrad)" filter="url(#glow)" opacity="0.4" />

  <!-- Shield Core Body -->
  <path d="M256 80 L398 135 C398 262 342 364 256 424 C170 364 114 262 114 135 Z" 
        fill="#121821" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Protective Pulse Ring -->
  <path d="M256 120 L360 162 C360 250 316 328 256 376 C196 328 152 250 152 162 Z" 
        fill="#0B0F14" stroke="#5B8FFF" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 8" />

  <!-- Center Family Protection Icon / Checkmark & Keyhole -->
  <g transform="translate(196, 185) scale(1)">
    <!-- Protective Padlock / Family guardian symbol -->
    <path d="M60 25 C60 14 51 5 40 5 C29 5 20 14 20 25 L20 40 L60 40 Z" 
          fill="none" stroke="#22C55E" stroke-width="8" stroke-linecap="round" />
    <rect x="10" y="38" width="60" height="48" rx="10" fill="#22C55E" />
    <!-- Keyhole -->
    <circle cx="40" cy="58" r="6" fill="#0B0F14" />
    <path d="M38 58 L42 58 L44 72 L36 72 Z" fill="#0B0F14" />
    <!-- AI Sparkle -->
    <path d="M90 10 L94 22 L106 26 L94 30 L90 42 L86 30 L74 26 L86 22 Z" fill="#5B8FFF" />
  </g>
</svg>
